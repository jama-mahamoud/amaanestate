    <!-- Internal Traffic DataLayer Initialization (runs synchronously before GTM) -->
    <script>
      (function () {
        try {
          var INTERNAL_KEY = 'amaan_internal_traffic';
          var OVERRIDE_KEY = 'amaan_internal_traffic_override';
          var w = window;
          w.dataLayer = w.dataLayer || [];

          var search = w.location.search || '';
          if (search && search.indexOf('ae_traffic=public') !== -1) {
            var params = new URLSearchParams(search);
            if (params.get('ae_traffic') === 'public') {
              w.localStorage.removeItem(INTERNAL_KEY);
              w.localStorage.setItem(OVERRIDE_KEY, 'public');
              params.delete('ae_traffic');
              var cleanQs = params.toString();
              var cleanUrl = w.location.pathname + (cleanQs ? '?' + cleanQs : '') + w.location.hash;
              w.history.replaceState(null, '', cleanUrl);
            }
          }

          var path = w.location.pathname || '/';
          var isAdminPath = path === '/admin' || path.indexOf('/admin/') === 0;
          var isMarkedInternal = w.localStorage.getItem(INTERNAL_KEY) === '1';

          if (isAdminPath || isMarkedInternal) {
            w.dataLayer.push({ traffic_type: 'internal' });
          }
        } catch (e) {
          // Ignore storage access restrictions
        }
      })();
    </script>
    <!-- Google Tag Manager & AdSense Deferred Loader (preserves DataLayer + verification without blocking FCP/LCP) -->
    <script>
      (function (w, d) {
        w.dataLayer = w.dataLayer || [];
        var tagsLoaded = false;
        function loadThirdPartyTags() {
          if (tagsLoaded) return;
          tagsLoaded = true;
          w.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
          var gtm = d.createElement('script');
          gtm.async = true;
          gtm.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-TGGX2LR5';
          d.head.appendChild(gtm);

          var ads = d.createElement('script');
          ads.async = true;
          ads.crossOrigin = 'anonymous';
          ads.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7965451372324178';
          d.head.appendChild(ads);
        }
        w.addEventListener('load', function () {
          if ('requestIdleCallback' in w) {
            w.requestIdleCallback(loadThirdPartyTags, { timeout: 1200 });
          } else {
            w.setTimeout(loadThirdPartyTags, 200);
          }
        }, { once: true });
        w.setTimeout(loadThirdPartyTags, 3500);
      })(window, document);
    </script>
