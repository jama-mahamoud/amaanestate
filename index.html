    <meta name="description" content="A modern, trustworthy, location-centric digital property discovery and marketplace platform for Jigjiga, Somali Region, and beyond." />

        "name": "AmaanEstate",
        "alternateName": "Amaan Estate",

        "description": "A modern, trustworthy, location-centric digital property discovery and marketplace platform."
